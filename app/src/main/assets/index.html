<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Brain</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 14px; background: #10131a; color: #eef2f7; }
    h2 { margin: 0 0 10px; font-size: 18px; color: #5eead4; }
    .card { background: #181d28; border: 1px solid #262e3d; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #9aa5b8; margin-bottom: 5px; }
    textarea, select, input { width: 100%; background: #0f131b; color: #fff; border: 1px solid #2d3748; border-radius: 8px; padding: 9px; font-size: 14px; }
    textarea { min-height: 92px; resize: vertical; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button { flex: 1; min-width: 100px; padding: 10px 12px; border: 0; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn-go { background: #2a8f82; color: #fff; }
    .btn-ext { background: #2563eb; color: #fff; }
    .btn-stop { background: #b91c1c; color: #fff; }
    .btn-sub { background: #262e3d; color: #e2e8f0; }
    .status { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: #111620; border-left: 3px solid #2a8f82; white-space: pre-wrap; word-break: break-word; }
    .queue-item { background: #121722; border: 1px solid #252e3e; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
    .queue-item small { color: #8b97ab; display: block; margin-top: 3px; }
  </style>
</head>
<body>
  <h2>Movie Brain Controller</h2>

  <div class="card">
    <label for="prompt">Prompt / Scene Description (Ek line = Ek clip)</label>
    <textarea id="prompt" placeholder="Scene 1: Hero enters dark alley&#10;Scene 2: Close-up of glowing blade&#10;Scene 3: Dramatic turn in rain"></textarea>

    <div class="row">
      <div style="flex:1">
        <label for="ori">Orientation</label>
        <select id="ori">
          <option value="9:16">9:16 (Portrait / Reel)</option>
          <option value="16:9">16:9 (Landscape)</option>
          <option value="1:1">1:1 (Square)</option>
        </select>
      </div>
      <div style="flex:1">
        <label for="delaySec">Auto Next Delay (sec)</label>
        <input id="delaySec" type="number" value="4" min="1" max="300" />
      </div>
    </div>

    <div class="row">
      <button class="btn-sub" onclick="addToQueue()">+ Queue Mein Jodo</button>
      <button class="btn-sub" onclick="clearQueue()">Clear Queue</button>
      <button class="btn-sub" onclick="openSite()">Site Dekho</button>
    </div>

    <div class="row">
      <button class="btn-go" onclick="startNew()">Naya Generate</button>
      <button class="btn-ext" onclick="startExtend()">Last Frame Extend</button>
      <button class="btn-stop" onclick="stopAll()">Stop</button>
    </div>
  </div>

  <div class="card">
    <label>Live Status</label>
    <div id="statusBox" class="status">Taiyar hai. Prompt daalo ya queue banao.</div>
  </div>

  <div class="card">
    <label>Queue (<span id="qCount">0</span>)</label>
    <div id="queueList"></div>
  </div>

  <script>
    const STORAGE_KEY = "mb_queue_v1";
    let queue = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let autoMode = false;
    let currentExtend = false;
    let nextTimer = null;

    function saveQueue() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));
      renderQueue();
    }

    function setStatus(msg) {
      document.getElementById("statusBox").textContent = msg;
      try {
        if (window.Android && Android.updateAutomation) {
          Android.updateAutomation(msg);
        }
      } catch (e) {}
    }

    function renderQueue() {
      document.getElementById("qCount").textContent = queue.length;
      const el = document.getElementById("queueList");
      if (!queue.length) {
        el.innerHTML = "<small style='color:#8b97ab'>Queue khali hai.</small>";
        return;
      }
      el.innerHTML = queue.map((item, idx) =>
        `<div class="queue-item">#${idx + 1} [${item.ori}] ${escapeHtml(item.prompt)}<small>Action: ${item.mode}</small></div>`
      ).join("");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function addToQueue() {
      const raw = document.getElementById("prompt").value || "";
      const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const ori = document.getElementById("ori").value;
      if (!lines.length) return alert("Pehle prompt likho.");

      lines.forEach(p => {
        const isFirstEver = queue.length === 0 && !currentExtend;
        queue.push({ prompt: p, ori, mode: isFirstEver ? "new" : "extend" });
      });

      document.getElementById("prompt").value = "";
      saveQueue();
      setStatus(lines.length + " prompt queue mein add hue (Total: " + queue.length + ").");
    }

    function clearQueue() {
      queue = [];
      saveQueue();
      setStatus("Queue saaf kar di gayi.");
    }

    function openSite() {
      try {
        if (window.Android && Android.toSite) Android.toSite();
      } catch (e) {}
    }

    function runPrompt(promptText, ori, isExtend) {
      if (!window.Android) return setStatus("Android bridge nahi mila.");
      currentExtend = isExtend;
      try {
        if (!Android.isAutomationActive || !Android.isAutomationActive()) {
          Android.startAutomation("Movie Brain automation chal raha hai");
        }
        Android.keepAwake(true);
        const res = Android.generate(promptText, ori, isExtend);
        setStatus((isExtend ? "Extend" : "New") + " bheja gaya (" + res + "): " + promptText.slice(0, 60));
      } catch (e) {
        setStatus("Error: " + e.message);
      }
    }

    function scheduleNextExtend() {
      if (nextTimer) clearTimeout(nextTimer);
      if (!autoMode || !queue.length) {
        autoMode = false;
        try {
          if (window.Android) Android.ring(3, 80);
        } catch (e) {}
        setStatus("Sab kaam poora ho gaya!");
        return;
      }
      const waitMs = (parseInt(document.getElementById("delaySec").value, 10) || 4) * 1000;
      const nextItem = queue.shift();
      saveQueue();
      setStatus("Agla clip " + (waitMs / 1000) + "s mein extend hoga: " + nextItem.prompt.slice(0, 45));
      nextTimer = setTimeout(() => {
        if (autoMode) runPrompt(nextItem.prompt, nextItem.ori, true);
      }, waitMs);
    }

    function startNew() {
      if (nextTimer) clearTimeout(nextTimer);
      autoMode = true;
      const pBox = document.getElementById("prompt");
      const lines = (pBox.value || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const ori = document.getElementById("ori").value;

      let item = null;
      if (lines.length) {
        item = { prompt: lines[0], ori, mode: "new" };
        if (lines.length > 1) {
          lines.slice(1).forEach(extra => queue.push({ prompt: extra, ori, mode: "extend" }));
          pBox.value = "";
          saveQueue();
        }
      } else if (queue.length) {
        item = queue.shift();
        saveQueue();
      }
      if (!item) {
        autoMode = false;
        return alert("Prompt likho ya queue mein add karo.");
      }
      runPrompt(item.prompt, item.ori, false);
    }

    function startExtend() {
      if (nextTimer) clearTimeout(nextTimer);
      autoMode = true;
      const pBox = document.getElementById("prompt");
      const lines = (pBox.value || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const ori = document.getElementById("ori").value;

      let item = null;
      if (lines.length) {
        item = { prompt: lines[0], ori, mode: "new" };
        if (lines.length > 1) {
          lines.slice(1).forEach(extra => queue.push({ prompt: extra, ori, mode: "extend" }));
          pBox.value = "";
          saveQueue();
        }
      } else if (queue.length) {
        item = queue.shift();
        saveQueue();
      }
      if (!item) {
        autoMode = false;
        return alert("Extend ke liye prompt likho ya queue mein add karo.");
      }
      runPrompt(item.prompt, item.ori, true);
    }

    function stopAll() {
      autoMode = false;
      if (nextTimer) {
        clearTimeout(nextTimer);
        nextTimer = null;
      }
      try {
        if (window.Android) {
          Android.stopAutomation();
          Android.keepAwake(false);
        }
      } catch (e) {}
      setStatus("Automation rok diya gaya.");
    }

    window.onFrame = function () {
      setStatus("Last frame capture ho gaya. Agla step taiyar...");
      scheduleNextExtend();
    };

    window.onDl = function (ok) {
      if (!ok) {
        autoMode = false;
        if (nextTimer) clearTimeout(nextTimer);
        try {
          if (window.Android) {
            Android.ring(4, 90);
            Android.notifyAlert("Movie Brain", "Download kharab hai — ruk gaya.");
          }
        } catch (e) {}
        setStatus("Download fail/kharab hua. Manual check karo.");
      }
    };

    window.onBot = function (status, detail) {
      setStatus("Bot [" + status + "]: " + (detail || ""));
      if (status === "error" || status === "captcha" || status === "limit") {
        autoMode = false;
        if (nextTimer) clearTimeout(nextTimer);
        try {
          if (window.Android) {
            Android.ring(4, 90);
            Android.notifyAlert("Movie Brain Alert", status + ": " + (detail || ""));
          }
        } catch (e) {}
      } else if (status === "done" || status === "completed" || status === "frame_ready") {
        scheduleNextExtend();
      }
    };

    renderQueue();
  </script>
</body>
</html>
